services:
  - type: web
    name: vial-science-lead-magnet
    runtime: node
    plan: starter
    buildCommand: npm install
    startCommand: npm start
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        sync: false
      - key: SITE_URL
        sync: false
      - key: RESEND_API_KEY
        sync: false
      - key: EMAIL_FROM
        sync: false
      - key: GUIDE_URL
        sync: false
      - key: COMMUNITY_URL
        sync: false
      - key: UNSUBSCRIBE_SECRET
        generateValue: true
      - key: EMAIL_ENABLED
        value: "false"
